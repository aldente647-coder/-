# Классификатор тем открытых ответов по перечню Заказчика.
#
# Категории и их состав взяты из анкеты: к вопросу 11 приложен перечень
# ответов для кодировки. Это уже не наша рабочая версия, а рамка Заказчика,
# поэтому категории не объединяются и не дробятся по нашему усмотрению —
# даже там, где это выглядело бы логичнее. «Лекарства» отделены от медицины,
# «состояние дорог» от общественного транспорта, «низкие доходы» от роста
# цен: так решил Заказчик, и сводить их обратно значит терять его разрез.
#
# У каждой темы два вида правил. Фразы ловят устойчивые обороты целиком,
# шаблоны — основу слова с любым окончанием. Без вторых классификатор
# разбирает только именительный падеж: «лекарства» находит, «лекарств
# в аптеке нет» пропускает, а в живой речи второе встречается чаще.
#
# Правится руками. Правка любого слова меняет version_id, и старая разметка
# остаётся привязана к своей версии — ТЗ §11.3 запрещает менять исторические
# данные скрытно.

name: "Темы открытых ответов по перечню Заказчика"
revision: "перечень к вопросу 11 анкеты телефонного мониторинга"

themes:
  - code: safety
    name: "Безопасность, военная обстановка"
    alarming: true
    priority: 16
    phrases:
      - безопасность
      - война
      - боевые действия
      - военная обстановка
      - страшно
    patterns:
      - 'обстрел\w*'
      - 'прилет\w*'
      - 'взрыв\w*'
      - 'бомб[яи]\w*'
      - 'опасн\w+'

  - code: prices
    name: "Рост цен на товары и услуги"
    alarming: true
    priority: 15
    phrases:
      - рост цен
      - подорожание
      - дороговизна
      - инфляция
      - все дорого
      - очень дорого
    patterns:
      - 'подорожа\w+'
      - '(?<!\w)цен[аыу](?!\w)'
      - '(?<!\w)цен(?!\w)'
    # «Дорого» и «дорога» — разные слова с общим корнем. Без этого
    # «разбитые дороги» попадали бы в рост цен.
    excludes:
      - дорога
      - дороги
      - дорогу
      - дороге

  - code: incomes
    name: "Низкие доходы, зарплаты, пенсии"
    alarming: true
    priority: 14
    phrases:
      - низкие доходы
      - маленькая зарплата
      - низкие зарплаты
      - маленькая пенсия
      - низкие пенсии
      - нищета
      - бедность
    patterns:
      - 'зарплат\w*'
      - 'пенси[яийюе]\w*'
      - 'доход\w*'
      - 'заработк\w*'
      - 'не хватает (денег|средств|на жизнь)'
      - 'денег (не хватает|мало)'

  - code: utilities
    name: "ЖКХ — электричество, вода, отопление, газ"
    alarming: true
    priority: 13
    phrases:
      - жкх
      - коммуналка
      - свет отключают
      - нет света
      - нет воды
      - нет отопления
      - нет газа
      - вода по графику
      - тарифы
    patterns:
      - 'коммунальн\w+'
      - 'электричеств\w*'
      - 'отоплени\w*'
      - 'водоснабжени\w*'
      - '(?<!\w)вод[аыу](?!\w)'
      - '(?<!\w)газ\w*(?!\w)'
      - 'отключ\w+ (свет|воду|газ|электричество)'

  - code: healthcare
    name: "Здоровье, качество медпомощи"
    alarming: true
    priority: 12
    phrases:
      - медпомощь
      - скорая
      - запись к врачу
      - здоровье
      - очереди в больнице
      - нет врачей
    patterns:
      - 'медицин\w*'
      - 'больниц\w*'
      - 'поликлиник\w*'
      - 'врач\w*'
      - 'лечен\w+'
      - 'фельдшер\w*'

  - code: medicines
    name: "Лекарства"
    alarming: true
    priority: 11
    phrases:
      - нет лекарств
      - лекарств не хватает
    patterns:
      - 'лекарств\w*'
      - 'аптек\w*'
      - 'таблетк\w*'
      - 'препарат\w*'

  - code: unemployment
    name: "Безработица"
    alarming: true
    priority: 10
    phrases:
      - нет работы
      - негде работать
      - работу не найти
      - сокращения
      - уволили
    patterns:
      - 'безработиц\w*'
      - 'безработн\w+'

  - code: payments
    name: "Выплаты и компенсации"
    alarming: true
    priority: 10
    phrases:
      - не платят
      - задерживают выплаты
      - материнский капитал
    patterns:
      - 'выплат\w*'
      - 'компенсаци\w*'
      - 'пособи\w*'
      - 'льгот\w*'

  - code: housing
    name: "Жильё"
    alarming: true
    priority: 9
    phrases:
      - негде жить
      - разрушенное жилье
      - восстановление жилья
      - крыша течет
      - аварийное жилье
      - ипотека
    patterns:
      - 'жиль[ея]\w*'
      - 'квартир\w*'
      - 'общежити\w*'

  - code: roads
    name: "Состояние дорог"
    priority: 9
    phrases:
      - состояние дорог
      - разбитые дороги
      - нет асфальта
      - ямы на дорогах
    patterns:
      - '(?<!\w)дорог[аиуе](?!\w)'
      - '(?<!\w)дорог(?!\w)'
      - 'асфальт\w*'
      - '(?<!\w)ям[ыа](?!\w)'

  - code: communications
    name: "Мобильная связь и интернет"
    priority: 8
    phrases:
      - мобильная связь
      - сотовая связь
      - нет связи
      - плохая связь
      - нет интернета
      - вышки
    patterns:
      - 'интернет\w*'
      - '(?<!\w)связ[ьи](?!\w)'

  - code: transport
    name: "Общественный транспорт"
    priority: 7
    phrases:
      - общественный транспорт
      - не доехать
      - редко ходят
    patterns:
      - 'транспорт\w*'
      - 'автобус\w*'
      - 'маршрутк\w*'
      - 'троллейбус\w*'
      - 'трамва\w*'
      - 'электричк\w*'

  - code: education
    name: "Детские сады и школы"
    priority: 6
    phrases:
      - нет мест в саду
      - образование
    patterns:
      - '(?<!\w)школ[аыуеы]?(?!\w)'
      - 'детск\w+ сад\w*'
      - 'садик\w*'
      - 'учител\w+'
      - 'учеб\w+'

  - code: documents
    name: "Оформление документов"
    priority: 5
    phrases:
      - оформление документов
      - очереди за документами
      - бюрократия
      - волокита
      - мфц
    patterns:
      - 'документ\w*'
      - 'справк\w*'
      - 'паспорт\w*'

  - code: nothing
    name: "Проблем нет"
    priority: 1
    phrases:
      - проблем нет
      - нет проблем
      - все хорошо
      - все устраивает
      - ничего не беспокоит
      - все нормально
