# Классификатор тем открытых ответов.
#
# Это НЕ утверждённый классификатор Заказчика. Собран по перечню тем
# постоянного ядра (ТЗ §7.2), чтобы разбор можно было отлаживать
# и демонстрировать до передачи настоящего.
#
# Правится руками. Правка любого слова меняет version_id, и старая разметка
# остаётся привязана к своей версии — ТЗ §11.3 запрещает менять исторические
# данные скрытно.

name: "Темы открытых ответов, рабочая версия"
revision: "черновик до утверждения Заказчиком"

themes:
  - code: prices
    name: "Цены и доходы"
    alarming: true
    priority: 10
    phrases:
      - цены
      - подорожание
      - зарплата
      - зарплаты
      - доходы
      - пенсия
      - денег не хватает
      - дороговизна
      - инфляция
      - тарифы
    patterns:
      - 'подорожа\w+'
      - 'дорож\w+'
      - 'не хватает (денег|средств|на жизнь)'
    excludes:
      - дорога
      - дороги

  - code: healthcare
    name: "Медицина"
    alarming: true
    priority: 9
    phrases:
      - медицина
      - больница
      - больницы
      - поликлиника
      - врач
      - врачи
      - лекарства
      - скорая
      - запись к врачу
    patterns:
      - 'лечен\w+'

  - code: housing
    name: "Жильё и ЖКХ"
    alarming: true
    priority: 8
    phrases:
      - жкх
      - коммуналка
      - отопление
      - вода
      - водоснабжение
      - канализация
      - капремонт
      - управляющая компания
      - крыша течет
      - подъезд
    patterns:
      - 'отключ\w+ (свет|воду|газ|электричество)'

  - code: safety
    name: "Безопасность"
    alarming: true
    priority: 10
    phrases:
      - безопасность
      - обстрелы
      - преступность
      - страшно
      - боюсь
      - тревожно
      - опасно
    patterns:
      - 'небезопасн\w+'

  - code: transport
    name: "Дороги и транспорт"
    priority: 6
    phrases:
      - дороги
      - дорога
      - транспорт
      - автобус
      - автобусы
      - маршрутка
      - ямы
      - остановка
    patterns:
      - 'разбит\w+ дорог\w+'

  - code: authorities
    name: "Работа органов власти"
    priority: 7
    phrases:
      - власть
      - власти
      - чиновники
      - администрация
      - мэр
      - губернатор
      - депутаты
      - бюрократия
    patterns:
      - 'не реагир\w+'

  - code: employment
    name: "Работа и занятость"
    priority: 6
    phrases:
      - работа
      - работы нет
      - безработица
      - уволили
      - сокращения
      - вакансии

  - code: education
    name: "Образование"
    priority: 5
    phrases:
      - школа
      - школы
      - детский сад
      - садик
      - учителя
      - образование
      - университет

  - code: nothing
    name: "Ничего не беспокоит / нет ответа"
    priority: 1
    phrases:
      - все устраивает
      - все хорошо
      - ничего
      - нет таких
      - никого
      - затрудняюсь
      - не знаю
