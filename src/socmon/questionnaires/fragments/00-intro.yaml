# Вступление, согласие и фильтры пригодности.
#
# Модуль общий для всех волн: формулировка вступления и согласия не меняется
# никогда, иначе рвётся сопоставимость откликов между волнами (ТЗ §3.1).

nodes:
  - id: intro
    kind: info
    section: intro
    audio_key: intro_v1
    # ТЗ §8.4. Длительность названа честно. Фраза «номер не фиксируется»
    # не используется: номер мы храним, он лишь отделён от аналитического
    # контура (ТЗ §14.2).
    text: >-
      Здравствуйте. Проводится короткий анонимный социологический опрос
      жителей Республики. Вы были выбраны случайным образом. Разговор ведёт
      голосовой помощник на основе искусственного интеллекта. Участие
      добровольное, вы можете не отвечать на любой вопрос и прекратить
      разговор в любой момент. Ваши контактные данные хранятся отдельно
      от ответов и не связываются с ними при обработке.
      Опрос займёт около десяти минут.
    next: consent

  - id: consent
    kind: consent
    section: intro
    audio_key: consent_v1
    text: "Вы согласны принять участие?"
    refuse_next: end_no_consent
    next: screen_age
    accept:
      code: 1
      label: "Согласен"
      phrases: ["да", "согласен", "согласна", "хорошо", "давайте", "можно",
                "конечно", "ладно", "не против", "спрашивайте", "задавайте"]
    decline:
      code: 2
      label: "Не согласен"
      phrases: ["нет", "не согласен", "не согласна", "не хочу", "некогда",
                "не буду", "нет времени", "занят", "занята"]

  - id: screen_age
    kind: screener
    section: intro
    audio_key: screen_age_v1
    text: "Скажите, пожалуйста, вам уже исполнилось восемнадцать лет?"
    fail_next: end_ineligible_age
    next: screen_territory
    pass_codes: [1]
    options:
      - code: 1
        label: "18 и старше"
        phrases: ["да", "исполнилось", "конечно", "давно", "есть", "совершеннолетний"]
      - code: 2
        label: "Младше 18"
        phrases: ["нет", "не исполнилось", "еще нет", "мне меньше", "несовершеннолетний"]

  - id: screen_territory
    kind: screener
    section: intro
    audio_key: screen_territory_v1
    text: "Вы постоянно проживаете на территории Республики?"
    fail_next: end_ineligible_territory
    next: "@next"
    pass_codes: [1]
    options:
      - code: 1
        label: "Проживает"
        phrases: ["да", "проживаю", "живу", "постоянно", "конечно", "всю жизнь"]
      - code: 2
        label: "Не проживает"
        phrases: ["нет", "не проживаю", "не живу", "я в другом", "приезжий",
                  "временно", "в отъезде"]
