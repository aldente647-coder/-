# Социально-демографический блок (вопросы 17-26 анкеты).
#
# Идёт после переменного блока и перед дополнительными модулями. Порядок
# выбран сознательно: обязательная часть интервью — ядро, переменный блок
# и соцдем — во всех волнах одна и та же и стоит на одном и том же месте,
# а модуль волны прицепляется следом. Если респондент бросит трубку
# на модуле, обязательная часть уже собрана целиком и интервью валидно.
#
# Соцдем нужен для взвешивания (ТЗ §5.4), поэтому пол, возраст и территория
# спрашиваются всегда, даже когда всё остальное респондент пропустил.

nodes:
  - id: sensitive_notice
    kind: info
    section: demography
    audio_key: sensitive_notice_v1
    # ТЗ §7.6: перед чувствительным блоком робот сообщает о праве не отвечать.
    text: >-
      Осталось несколько вопросов о вас. На любой из них можно не отвечать —
      просто скажите, что затрудняетесь.
    next: d_gender

  - id: d_gender
    kind: single
    section: demography
    core_key: gender
    audio_key: d_gender_v1
    # Анкета Заказчика предполагает фиксацию пола без вопроса, по голосу,
    # и вопрос только при неоднозначности. Автоопределение по голосу — это
    # отдельная модель со своей ошибкой, и ошибка эта попадёт прямо
    # в веса выборки. Пока её нет и она не измерена, спрашиваем прямо:
    # лишние три секунды дешевле смещения в половой структуре.
    text: "Укажите, пожалуйста, ваш пол."
    next: d_age
    options:
      - code: 1
        label: "Мужской"
        phrases: ["мужской", "мужчина", "муж", "мужик", "я мужчина"]
      - code: 2
        label: "Женский"
        phrases: ["женский", "женщина", "жен", "я женщина"]

  - id: d_age
    kind: scale
    section: demography
    core_key: age
    audio_key: d_age_v1
    text: "Сколько вам полных лет?"
    # Верх шкалы 94 — предел зоны содержательных кодов: с 95 начинаются
    # служебные. Возраст 94 и старше сводится в верхнюю точку. На выборке
    # в несколько тысяч человек это единицы наблюдений, а путаница
    # «код 96 — это возраст или отказ» стоила бы всего массива.
    low: 18
    high: 94
    low_label: "восемнадцать"
    high_label: "девяносто четыре и старше"
    next: d_settlement

  - id: d_settlement
    kind: open
    section: demography
    audio_key: d_settlement_v1
    # Открытый вопрос, а не список: перечень населённых пунктов и районов
    # утверждается Заказчиком на каждую волну, и до утверждения зачитывать
    # роботом нечего. Ответ кодируется по справочнику при обработке.
    text: "В каком населённом пункте и районе вы живёте?"
    max_seconds: 20
    max_mentions: 1
    next: d_education

  - id: d_education
    kind: single
    section: demography
    core_key: education
    audio_key: d_education_v1
    text: >-
      Какое у вас образование: неполное среднее, среднее, среднее специальное
      или высшее?
    next: d_svo_participant
    options:
      - code: 1
        label: "Неполное среднее"
        phrases: ["неполное среднее", "неполное", "девять классов", "восемь классов"]
      - code: 2
        label: "Среднее"
        phrases: ["среднее", "школа", "одиннадцать классов", "десять классов"]
      - code: 3
        label: "Среднее специальное"
        phrases: ["среднее специальное", "техникум", "колледж", "училище",
                  "профессиональное", "спо", "пту"]
      - code: 4
        label: "Высшее"
        phrases: ["высшее", "университет", "институт", "вуз", "академия"]

  - id: d_svo_participant
    kind: single
    section: demography
    core_key: svo_participant
    audio_key: d_svo_participant_v1
    text: "Вы являетесь участником специальной военной операции?"
    next: d_veteran
    sensitive: true
    required: false
    options:
      - code: 1
        label: "Да"
        phrases: ["да", "являюсь", "участник", "был", "воевал", "служу", "служил"]
      - code: 2
        label: "Нет"
        phrases: ["нет", "не являюсь", "не участник", "не был", "не воевал"]

  - id: d_veteran
    kind: single
    section: demography
    core_key: veteran
    audio_key: d_veteran_v1
    text: "Вы являетесь ветераном боевых действий?"
    next: d_svo_family
    sensitive: true
    required: false
    options:
      - code: 1
        label: "Да"
        phrases: ["да", "являюсь", "ветеран", "есть удостоверение"]
      - code: 2
        label: "Нет"
        phrases: ["нет", "не являюсь", "не ветеран"]

  - id: d_svo_family
    kind: single
    section: demography
    core_key: svo_family
    audio_key: d_svo_family_v1
    text: >-
      Есть ли среди членов вашей семьи участники специальной военной операции?
    next: d_employment
    sensitive: true
    required: false
    options:
      - code: 1
        label: "Да"
        phrases: ["да", "есть", "сын", "муж", "брат", "отец", "внук"]
      - code: 2
        label: "Нет"
        phrases: ["нет", "никого", "не было", "нету"]

  - id: d_employment
    kind: single
    section: demography
    core_key: employment
    audio_key: d_employment_v1
    text: >-
      Вы сейчас работаете, учитесь, находитесь на пенсии или временно
      не работаете?
    next: d_nationality
    options:
      - code: 1
        label: "Работает"
        phrases: ["работаю", "работает", "тружусь", "занят", "занята",
                  "свое дело", "предприниматель"]
      - code: 2
        label: "Учится"
        phrases: ["учусь", "студент", "студентка", "школьник", "школьница"]
      - code: 3
        label: "Пенсионер"
        phrases: ["пенсия", "на пенсии", "пенсионер", "пенсионерка"]
      - code: 4
        label: "Не работает"
        phrases: ["не работаю", "безработный", "безработная",
                  "временно не работаю", "в декрете", "ищу работу"]

  - id: d_nationality
    kind: single
    section: demography
    core_key: nationality
    audio_key: d_nationality_v1
    text: "К какой национальности вы себя относите?"
    next: "@next"
    sensitive: true
    required: false
    options:
      - code: 1
        label: "Русский"
        phrases: ["русский", "русская", "россиянин", "россиянка"]
      - code: 2
        label: "Украинец"
        phrases: ["украинец", "украинка"]
      - code: 3
        label: "Другая"
        phrases: ["другая", "другой", "иная", "грек", "гречанка", "армянин",
                  "татарин", "белорус", "белоруска"]
