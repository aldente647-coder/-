# Дополнительный модуль «Среда и инфраструктура»: Д11-Д18, Д25.
# Благоустройство, жильё, дороги, транспорт, экология, ТБО, ЖКХ, спорт.
# Хронометраж ~1:30.

_scales:
  satisfaction: &satisfaction
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена", "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да", "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена", "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет", "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
  satisfaction_unused: &satisfaction_unused
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена", "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да", "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена", "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет", "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не пользуюсь"
      phrases: ["не пользуюсь", "не хожу", "не езжу", "не бываю"]
  satisfaction_nosport: &satisfaction_nosport
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена", "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да", "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена", "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет", "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не занимаюсь физкультурой и спортом"
      phrases: ["не занимаюсь", "не занимаюсь спортом", "не хожу на спорт"]

nodes:
  - id: mod_env_intro
    kind: info
    section: variable
    audio_key: mod_env_intro_v1
    text: >-
      И последний короткий блок — об условиях жизни в вашем населённом пункте.
      На каждый вопрос отвечайте одним из четырёх вариантов: полностью
      удовлетворён, скорее удовлетворён, скорее не удовлетворён
      или совсем не удовлетворён.
    next: d11_amenities

  - id: d11_amenities
    kind: single
    section: variable
    core_key: sat_amenities
    audio_key: d11_amenities_v1
    text: >-
      Насколько вы удовлетворены благоустройством вашего населённого пункта —
      двора, улиц, парков, освещения?
    next: d12_housing
    options: *satisfaction

  - id: d12_housing
    kind: single
    section: variable
    core_key: housing_availability
    audio_key: d12_housing_v1
    text: >-
      Как вы оцениваете доступность жилья в вашем населённом пункте —
      возможность приобрести или снять жильё: скорее доступно
      или скорее недоступно?
    next: d13_roads
    options:
      - code: 1
        label: "Скорее доступно"
        phrases: ["доступно", "скорее доступно", "можно", "реально", "первое"]
      - code: 2
        label: "Скорее недоступно"
        phrases: ["недоступно", "скорее недоступно", "не доступно", "дорого",
                  "нереально", "второе"]

  - id: d13_roads
    kind: single
    section: variable
    core_key: sat_roads
    audio_key: d13_roads_v1
    text: "Насколько вы удовлетворены состоянием дорог в вашем регионе?"
    next: d14_city_transport
    options: *satisfaction

  - id: d14_city_transport
    kind: single
    section: variable
    core_key: sat_city_transport
    audio_key: d14_city_transport_v1
    text: >-
      Насколько вы удовлетворены работой городского и пригородного
      общественного транспорта?
    next: d15_intercity_transport
    options: *satisfaction_unused

  - id: d15_intercity_transport
    kind: single
    section: variable
    core_key: sat_intercity_transport
    audio_key: d15_intercity_transport_v1
    # Сводный индекс по Д14 и Д15 считается на этапе анализа.
    text: >-
      А работой междугородного транспорта — автобусов, поездов между городами?
    next: d16_ecology
    options: *satisfaction_unused

  - id: d16_ecology
    kind: single
    section: variable
    core_key: ecology
    audio_key: d16_ecology_v1
    text: >-
      Как вы оцениваете экологическую ситуацию в вашем населённом пункте:
      скорее хорошая или скорее плохая?
    next: d17_waste
    options:
      - code: 1
        label: "Скорее хорошая"
        phrases: ["хорошая", "скорее хорошая", "нормальная", "неплохая", "первое"]
      - code: 2
        label: "Скорее плохая"
        phrases: ["плохая", "скорее плохая", "плохо", "ужасная", "второе"]

  - id: d17_waste
    kind: single
    section: variable
    core_key: sat_waste
    audio_key: d17_waste_v1
    text: >-
      Насколько вы удовлетворены тем, как организован вывоз и обращение
      с бытовыми отходами, мусором?
    next: d18_utilities
    options: *satisfaction

  - id: d18_utilities
    kind: single
    section: variable
    core_key: sat_utilities
    audio_key: d18_utilities_v1
    text: >-
      Насколько вы удовлетворены работой жилищно-коммунального хозяйства —
      вода, отопление, электричество, содержание домов?
    next: d25_sport
    options: *satisfaction

  - id: d25_sport
    kind: single
    section: variable
    core_key: sat_sport
    audio_key: d25_sport_v1
    text: >-
      Насколько вы удовлетворены условиями для занятий физкультурой и спортом
      в вашем населённом пункте — площадками, залами, секциями,
      их доступностью?
    next: "@next"
    options: *satisfaction_nosport
