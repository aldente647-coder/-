# Постоянное ядро. Задаётся в каждой волне, формулировки не меняются.
#
# Нумерация узлов повторяет нумерацию анкеты Заказчика, включая пропуск
# шестого вопроса: в исходном документе его нет. Сквозная перенумерация
# была бы удобнее в чтении и хуже во всём остальном — сверять данные
# с бумажной анкетой пришлось бы через таблицу соответствий.
#
# Каждый закрытый вопрос зачитывает свои варианты: в телефонном интервью
# респондент не видит карточки и выбрать может только из услышанного.

nodes:
  # ------------------------------------------------- оценка ситуации (1-2)
  - id: q01_region
    kind: single
    section: core
    core_key: region_satisfaction
    audio_key: q01_region_v1
    text: >-
      Положением дел в регионе в целом вы довольны или не довольны?
    next: q02_dynamics
    options:
      - code: 1
        label: "Доволен"
        phrases: ["доволен", "довольна", "довольны", "устраивает", "да", "скорее доволен"]
      - code: 2
        label: "Не доволен"
        phrases: ["не доволен", "не довольна", "недоволен", "недовольна",
                  "не устраивает", "нет", "скорее не доволен"]

  - id: q02_dynamics
    kind: single
    section: core
    core_key: settlement_dynamics
    audio_key: q02_dynamics_v1
    text: >-
      За последние две недели ситуация в вашем населённом пункте скорее
      улучшилась, скорее ухудшилась или не изменилась?
    next: q03_intro
    options:
      - code: 1
        label: "Скорее улучшилась"
        phrases: ["улучшилась", "скорее улучшилась", "лучше", "получше",
                  "стало лучше", "улучшение", "первое"]
      - code: 2
        label: "Не изменилась"
        phrases: ["не изменилась", "так же", "без изменений", "никак",
                  "как была", "как было", "одинаково", "все то же", "второе"]
      - code: 3
        label: "Скорее ухудшилась"
        phrases: ["ухудшилась", "скорее ухудшилась", "хуже", "похуже",
                  "стало хуже", "ухудшение", "третье"]

  # ------------------------------------------------------ доверие власти (3)
  - id: q03_intro
    kind: info
    section: core
    audio_key: q03_intro_v1
    text: >-
      Скажите, пожалуйста, вы доверяете или не доверяете перечисленным
      органам власти. Отвечайте по каждому: доверяю или не доверяю.
    next: q03a_federal

  - id: q03a_federal
    kind: single
    section: core
    core_key: trust_federal
    audio_key: q03a_federal_v1
    text: "Федеральным органам власти России вы доверяете или не доверяете?"
    next: q03b_republic
    options:
      - code: 1
        label: "Доверяю"
        phrases: ["доверяю", "доверяем", "да", "конечно", "скорее доверяю"]
      - code: 2
        label: "Не доверяю"
        phrases: ["не доверяю", "недоверие", "нет", "скорее не доверяю",
                  "совсем не доверяю"]

  - id: q03b_republic
    kind: single
    section: core
    core_key: trust_republic
    audio_key: q03b_republic_v1
    text: "А властям Республики вы доверяете или не доверяете?"
    next: q03c_local
    options:
      - code: 1
        label: "Доверяю"
        phrases: ["доверяю", "доверяем", "да", "конечно", "скорее доверяю"]
      - code: 2
        label: "Не доверяю"
        phrases: ["не доверяю", "недоверие", "нет", "скорее не доверяю",
                  "совсем не доверяю"]

  - id: q03c_local
    kind: single
    section: core
    core_key: trust_local
    audio_key: q03c_local_v1
    text: >-
      А местным властям вашего города или района вы доверяете или не доверяете?
    next: q04_president
    options:
      - code: 1
        label: "Доверяю"
        phrases: ["доверяю", "доверяем", "да", "конечно", "скорее доверяю"]
      - code: 2
        label: "Не доверяю"
        phrases: ["не доверяю", "недоверие", "нет", "скорее не доверяю",
                  "совсем не доверяю"]

  # ------------------------------------------------------- оценки лиц (4-5)
  - id: q04_president
    kind: single
    section: core
    core_key: rating_president
    audio_key: q04_president_v1
    text: >-
      Как вы считаете, Президент Владимир Путин работает на своём посту
      хорошо или плохо?
    next: q05_head
    options:
      - code: 1
        label: "Хорошо"
        phrases: ["хорошо", "отлично", "нормально", "неплохо", "скорее хорошо"]
      - code: 2
        label: "Плохо"
        phrases: ["плохо", "скорее плохо", "ужасно", "отвратительно", "нехорошо"]

  - id: q05_head
    kind: single
    section: core
    core_key: rating_head
    audio_key: q05_head_v1
    text: >-
      А Денис Пушилин работает на своём посту хорошо или плохо?
    next: q_fairness
    options:
      - code: 1
        label: "Хорошо"
        phrases: ["хорошо", "отлично", "нормально", "неплохо", "скорее хорошо"]
      - code: 2
        label: "Плохо"
        phrases: ["плохо", "скорее плохо", "ужасно", "отвратительно", "нехорошо"]

  # -------------------------------------------------- справедливость власти
  # Номера в анкете Заказчика у этого вопроса нет: он пришёл из переменного
  # блока, где значился под П6. Перенесён в ядро, потому что входит в индекс
  # напряжённости, а компонент индекса не может стоять там, где вопрос
  # вправе исчезнуть в очередной волне.
  #
  # Ключ показателя сохранён прежним — ряд продолжается, а не начинается
  # заново. Место выбрано по смыслу: он примыкает к оценкам власти,
  # а не к вопросам о собственном быте.
  - id: q_fairness
    kind: single
    section: core
    core_key: fairness
    audio_key: q_fairness_v1
    text: >-
      Как вы считаете, к людям вроде вас власти относятся справедливо
      или несправедливо?
    next: q07_material
    options:
      - code: 1
        label: "Справедливо"
        phrases: ["справедливо", "нормально", "хорошо", "по справедливости",
                  "скорее справедливо"]
      - code: 2
        label: "Несправедливо"
        phrases: ["несправедливо", "не справедливо", "плохо",
                  "скорее несправедливо", "безразлично относятся"]

  # ------------------------------------------ самочувствие и быт (7-10)
  # Вопрос 7 идёт сразу за пятым: шестого в анкете Заказчика нет.
  - id: q07_material
    kind: single
    section: core
    core_key: material_status
    audio_key: q07_material_v1
    text: >-
      Как вы оцениваете материальное положение вашей семьи сейчас: денег
      хватает на всё необходимое и на крупные покупки; хватает на повседневные
      расходы, но крупные покупки затруднительны; хватает только на самое
      необходимое; или не хватает даже на самое необходимое?
    next: q08_safety
    sensitive: true
    options:
      - code: 1
        label: "Хватает на всё и на крупные покупки"
        phrases: ["на все необходимое и на крупные", "на крупные покупки",
                  "хватает на все", "первое", "первый"]
      - code: 2
        label: "Хватает на повседневные расходы"
        phrases: ["на повседневные", "повседневные расходы", "крупные затруднительны",
                  "второе", "второй"]
      - code: 3
        label: "Хватает только на самое необходимое"
        phrases: ["только на самое необходимое", "на самое необходимое",
                  "третье", "третий"]
      - code: 4
        label: "Не хватает даже на самое необходимое"
        phrases: ["не хватает даже", "не хватает", "ни на что не хватает",
                  "четвертое", "четвертый"]

  - id: q08_safety
    kind: single
    section: core
    core_key: safety
    audio_key: q08_safety_v1
    text: >-
      Насколько вы лично чувствуете себя в безопасности там, где живёте:
      скорее в безопасности или скорее не в безопасности?
    next: q09_anxiety
    options:
      - code: 1
        label: "Скорее в безопасности"
        phrases: ["в безопасности", "скорее в безопасности", "безопасно",
                  "спокойно", "первое"]
      - code: 2
        label: "Скорее не в безопасности"
        phrases: ["не в безопасности", "скорее не в безопасности", "небезопасно",
                  "опасно", "тревожно", "второе"]

  - id: q09_anxiety
    kind: single
    section: core
    core_key: anxiety_dynamics
    audio_key: q09_anxiety_v1
    text: >-
      За последние две недели ваша личная тревога, напряжение выросли,
      снизились или не изменились?
    next: q10_health
    options:
      - code: 1
        label: "Выросли"
        phrases: ["выросли", "вырос", "выросла", "увеличились", "больше",
                  "сильнее", "первое"]
      - code: 2
        label: "Не изменились"
        phrases: ["не изменились", "так же", "без изменений", "никак",
                  "одинаково", "как было", "второе"]
      - code: 3
        label: "Снизились"
        phrases: ["снизились", "снизилась", "уменьшились", "меньше",
                  "спокойнее", "третье"]

  - id: q10_health
    kind: single
    section: core
    core_key: health
    audio_key: q10_health_v1
    text: >-
      Как вы оцениваете своё здоровье: хорошее, удовлетворительное или плохое?
    next: q11_problems
    options:
      - code: 1
        label: "Хорошее"
        phrases: ["хорошее", "хорошо", "отличное", "прекрасное", "первое"]
      - code: 2
        label: "Удовлетворительное"
        phrases: ["удовлетворительное", "нормальное", "среднее", "так себе",
                  "терпимо", "второе"]
      - code: 3
        label: "Плохое"
        phrases: ["плохое", "плохо", "неважное", "слабое", "третье"]

  # ----------------------------------------------- открытые вопросы (11-13)
  - id: q11_problems
    kind: open
    section: core
    audio_key: q11_problems_v1
    text: >-
      Какие проблемы сегодня наиболее остры для вас и вашей семьи?
      Назовите, пожалуйста, до трёх.
    max_seconds: 45
    max_mentions: 3
    next: q12_prices

  - id: q12_prices
    kind: open
    section: core
    audio_key: q12_prices_v1
    text: >-
      По вашему мнению, за последний месяц на какие товары и услуги цены
      выросли больше всего? Назовите до трёх.
    max_seconds: 45
    max_mentions: 3
    next: q13_normalization

  - id: q13_normalization
    kind: open
    section: core
    audio_key: q13_normalization_v1
    text: >-
      Что необходимо сделать в первую очередь для нормализации жизни
      в вашем населённом пункте? Назовите до трёх.
    max_seconds: 45
    max_mentions: 3
    next: q14_sources

  # ------------------------------------------------ источники новостей (14)
  - id: q14_sources
    kind: multi
    section: core
    core_key: news_sources
    audio_key: q14_sources_v1
    text: >-
      Откуда вы чаще всего узнаёте новости о событиях в вашем регионе
      и в стране? Можно назвать до трёх: телевидение; разговоры с людьми;
      социальные сети и блоги; новостные и официальные сайты; каналы в Max;
      Telegram-каналы; мессенджеры; радио; газеты и журналы.
    max_answers: 3
    next: q15_trusted
    options:
      - code: 1
        label: "Телевидение"
        phrases: ["телевидение", "телевизор", "тв", "по телевизору", "телек"]
      - code: 2
        label: "Разговоры с людьми"
        phrases: ["разговоры с людьми", "от людей", "от знакомых", "от соседей",
                  "сарафанное радио", "разговоры"]
      - code: 3
        label: "Интернет — соцсети, блоги"
        phrases: ["соцсети", "социальные сети", "блоги", "блогеры",
                  "одноклассники", "вконтакте"]
      - code: 4
        label: "Интернет — новостные и официальные сайты"
        phrases: ["новостные сайты", "официальные сайты", "аналитические сайты",
                  "сайты", "новостные ленты", "интернет издания"]
      - code: 5
        label: "Max-каналы"
        phrases: ["макс", "max", "макс каналы", "в максе"]
      - code: 6
        label: "Telegram-каналы"
        phrases: ["телеграм", "telegram", "телега", "телеграм каналы", "тг"]
      - code: 7
        label: "Мессенджеры"
        phrases: ["мессенджеры", "вайбер", "viber", "вотсап", "whatsapp", "ватсап"]
      - code: 8
        label: "Радио"
        phrases: ["радио", "по радио"]
      - code: 9
        label: "Газеты, журналы"
        phrases: ["газеты", "журналы", "пресса", "печать"]
      - code: 10
        label: "Другое"
        phrases: ["другое", "иное", "по другому"]

  # ------------------------------------------------- доверенный источник (15)
  - id: q15_trusted
    kind: open
    section: core
    audio_key: q15_trusted_v1
    # ТЗ §7.5 приводит этот вопрос как пример. Неоднозначные имена уходят
    # на ручную проверку — робот не решает, кто именно назван.
    text: >-
      Есть ли человек, канал, сообщество или источник информации, которому
      вы особенно доверяете в вопросах, важных для жизни вашего города
      или Республики? Назовите, пожалуйста, или скажите, что таких нет.
    max_seconds: 45
    max_mentions: 2
    next: q16_svo

  # ---------------------------------------------------------------- СВО (16)
  - id: q16_svo
    kind: single
    section: core
    core_key: svo_attitude
    audio_key: q16_svo_v1
    text: >-
      Как вы в целом относитесь к специальной военной операции России
      на Украине: положительно, отрицательно или нейтрально?
    next: "@next"
    sensitive: true
    required: false
    options:
      - code: 1
        label: "Положительно"
        phrases: ["положительно", "хорошо", "поддерживаю", "за", "одобряю"]
      - code: 2
        label: "Отрицательно"
        phrases: ["отрицательно", "плохо", "не поддерживаю", "против", "не одобряю"]
      - code: 3
        label: "Нейтрально, безразлично"
        phrases: ["нейтрально", "безразлично", "все равно", "никак",
                  "не задумывался", "не задумывалась"]
