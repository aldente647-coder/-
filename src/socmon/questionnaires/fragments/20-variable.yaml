# Переменный блок: информационное поле и отношение к власти.
#
# В отличие от ядра, этот блок Заказчик вправе менять от волны к волне.
# Ключи показателей всё равно стабильны: если вопрос вернётся через три
# волны, ряд должен продолжиться, а не начаться заново.
#
# Вопрос П6 о справедливости отсюда убран: он входит в индекс напряжённости,
# а компонент индекса не может лежать там, где вопрос вправе исчезнуть
# в очередной волне. Перенесён в постоянное ядро решением Заказчика.

nodes:
  # ------------------------------------------------------ отзывы о главе (П1)
  - id: p01_intro
    kind: info
    section: variable
    audio_key: p01_intro_v1
    text: >-
      Сейчас несколько вопросов о том, что вы слышите вокруг. Какие отзывы
      о деятельности Дениса Пушилина вам приходилось слышать в последнее
      время? Отвечайте по каждому источнику: в основном положительные,
      в основном отрицательные, и те и другие, или отзывов не слышали.
    next: p01a_relatives

  - id: p01a_relatives
    kind: single
    section: variable
    core_key: feedback_relatives
    audio_key: p01a_relatives_v1
    text: "От родственников, друзей, знакомых — какие отзывы вы слышали?"
    next: p01b_tv
    options:
      - code: 1
        label: "В основном положительные"
        phrases: ["положительные", "в основном положительные", "хорошие",
                  "хвалят", "первое"]
      - code: 2
        label: "В основном отрицательные"
        phrases: ["отрицательные", "в основном отрицательные", "плохие",
                  "ругают", "второе"]
      - code: 3
        label: "И положительные, и отрицательные"
        phrases: ["и те и другие", "и положительные и отрицательные",
                  "по разному", "разные", "пополам", "третье"]
      - code: 4
        label: "Не слышал отзывов"
        phrases: ["не слышал", "не слышала", "не приходилось", "не обсуждаем",
                  "никаких", "четвертое"]

  - id: p01b_tv
    kind: single
    section: variable
    core_key: feedback_tv
    audio_key: p01b_tv_v1
    text: "А в телевизионных новостях — какие отзывы вы слышали?"
    next: p01c_social
    options:
      - code: 1
        label: "В основном положительные"
        phrases: ["положительные", "в основном положительные", "хорошие",
                  "хвалят", "первое"]
      - code: 2
        label: "В основном отрицательные"
        phrases: ["отрицательные", "в основном отрицательные", "плохие",
                  "ругают", "второе"]
      - code: 3
        label: "И положительные, и отрицательные"
        phrases: ["и те и другие", "и положительные и отрицательные",
                  "по разному", "разные", "пополам", "третье"]
      - code: 4
        label: "Не слышал отзывов"
        phrases: ["не слышал", "не слышала", "не смотрю", "не приходилось",
                  "никаких", "четвертое"]

  - id: p01c_social
    kind: single
    section: variable
    core_key: feedback_social
    audio_key: p01c_social_v1
    text: >-
      А в социальных сетях, мессенджерах, Telegram-каналах — какие отзывы
      вы слышали?
    next: p02_media_trust
    options:
      - code: 1
        label: "В основном положительные"
        phrases: ["положительные", "в основном положительные", "хорошие",
                  "хвалят", "первое"]
      - code: 2
        label: "В основном отрицательные"
        phrases: ["отрицательные", "в основном отрицательные", "плохие",
                  "ругают", "второе"]
      - code: 3
        label: "И положительные, и отрицательные"
        phrases: ["и те и другие", "и положительные и отрицательные",
                  "по разному", "разные", "пополам", "третье"]
      - code: 4
        label: "Не слышал отзывов"
        phrases: ["не слышал", "не слышала", "не пользуюсь", "не читаю",
                  "никаких", "четвертое"]

  # ------------------------------------------------- доверие к СМИ (П2)
  - id: p02_media_trust
    kind: multi
    section: variable
    core_key: media_trust
    audio_key: p02_media_trust_v1
    text: >-
      Какие средства массовой информации, интернет-ресурсы вызывают у вас
      наибольшее доверие? Можно назвать до трёх: российские федеральные СМИ;
      местные СМИ Республики; Telegram-каналы; соцсети и блоги; мессенджеры;
      украинские СМИ; зарубежные СМИ; разговоры с людьми. Или скажите,
      что не доверяете никому.
    max_answers: 3
    # «Никому не доверяю» вместе с названным источником — противоречие.
    # Оставляем исключающий вариант: он сказан позже и осознаннее.
    exclusive_codes: [10]
    next: p03_info_gaps
    options:
      - code: 1
        label: "Российские федеральные СМИ"
        phrases: ["федеральные", "российские федеральные", "центральные",
                  "федеральные сми", "первый канал", "россия"]
      - code: 2
        label: "Местные СМИ Республики"
        phrases: ["местные", "местные сми", "республиканские", "наши сми",
                  "местное телевидение"]
      - code: 3
        label: "Telegram-каналы"
        phrases: ["телеграм", "telegram", "телега", "телеграм каналы", "тг"]
      - code: 4
        label: "Соцсети, блоги"
        phrases: ["соцсети", "социальные сети", "блоги", "блогеры", "вконтакте"]
      - code: 5
        label: "Мессенджеры"
        phrases: ["мессенджеры", "вайбер", "viber", "вотсап", "whatsapp", "ватсап"]
      - code: 6
        label: "Украинские СМИ"
        phrases: ["украинские", "украинские сми", "украина"]
      - code: 7
        label: "Зарубежные, западные СМИ"
        phrases: ["зарубежные", "западные", "иностранные", "зарубежные сми"]
      - code: 8
        label: "Разговоры с людьми"
        phrases: ["разговоры с людьми", "от людей", "от знакомых", "люди",
                  "сарафанное радио"]
      - code: 9
        label: "Другое"
        phrases: ["другое", "иное"]
      - code: 10
        label: "Никому не доверяю"
        phrases: ["никому не доверяю", "никому", "ни одному", "никаким",
                  "нет таких", "все врут"]

  # ------------------------------------------------ дефицит информации (П3)
  - id: p03_info_gaps
    kind: open
    section: variable
    audio_key: p03_info_gaps_v1
    text: >-
      Информации по каким темам вам сейчас не хватает? Назовите до трёх.
    max_seconds: 45
    max_mentions: 3
    next: p04_tv_frequency

  # ------------------------------------------------- частота новостей (П4-П5)
  - id: p04_tv_frequency
    kind: single
    section: variable
    core_key: tv_news_frequency
    audio_key: p04_tv_frequency_v1
    text: >-
      Вы стали смотреть новостные телепередачи чаще, реже или так же часто,
      как раньше?
    next: "@next"
    # Причину спрашиваем только у тех, кто стал смотреть реже: остальным
    # вопрос «почему реже» бессмыслен и звучит как сбой робота.
    routes:
      3: p05_tv_less_reason
    options:
      - code: 1
        label: "Чаще"
        phrases: ["чаще", "больше", "стал чаще", "стала чаще", "первое"]
      - code: 2
        label: "Так же"
        phrases: ["так же", "так же часто", "одинаково", "не изменилось",
                  "как раньше", "второе"]
      - code: 3
        label: "Реже"
        phrases: ["реже", "меньше", "стал реже", "стала реже", "почти не смотрю",
                  "не смотрю", "третье"]

  - id: p05_tv_less_reason
    kind: open
    section: variable
    audio_key: p05_tv_less_reason_v1
    text: "А почему реже? Назовите одну-две причины."
    max_seconds: 30
    max_mentions: 2
    next: "@next"
