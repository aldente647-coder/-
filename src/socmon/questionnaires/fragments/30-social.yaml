# Дополнительный модуль «Социальная сфера»: Д1-Д10.
# Образование, медицина, молодёжь, культура, дети. Хронометраж ~1:40.
#
# Модуль целиком в одну волну с ядром и переменным блоком не помещается —
# поэтому перечень национальных целей разложен на три модуля по волнам
# (см. таблицу в анкете Заказчика).
#
# Единая шкала удовлетворённости для всех вопросов блока задана один раз
# якорем: если формулировку варианта поправят в одном вопросе и забудут
# в остальных, сравнивать между собой станет нечего.

_scales:
  satisfaction: &satisfaction
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена",
                "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да",
                "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена",
                "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет",
                "совершенно не удовлетворен", "абсолютно нет", "четвертое"]

  satisfaction_never: &satisfaction_never
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена",
                "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да",
                "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена",
                "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет",
                "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не сталкивался с этим"
      phrases: ["не сталкивался", "не сталкивалась", "не приходилось",
                "не знаю об этом", "меня не касается"]

  satisfaction_unused: &satisfaction_unused
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена",
                "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да",
                "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена",
                "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет",
                "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не пользуюсь"
      phrases: ["не пользуюсь", "не хожу", "не посещаю", "не бываю"]

nodes:
  - id: mod_social_intro
    kind: info
    section: variable
    audio_key: mod_social_intro_v1
    text: >-
      И последний короткий блок — об условиях жизни в вашем регионе.
      На каждый вопрос отвечайте одним из четырёх вариантов: полностью
      удовлетворён, скорее удовлетворён, скорее не удовлетворён
      или совсем не удовлетворён.
    next: d01_filter

  # ------------------------------------------------------ образование (Д1-Д4)
  - id: d01_filter
    kind: single
    section: variable
    core_key: kids_preschool
    audio_key: d01_filter_v1
    text: >-
      Есть ли у вас дети до семи лет или внуки, которые ходят в детский сад?
    next: d01_preschool
    options:
      - code: 1
        label: "Есть"
        phrases: ["да", "есть", "ходят", "ходит", "конечно"]
      - code: 2
        label: "Нет"
        phrases: ["нет", "нету", "не ходят", "не ходит", "таких нет"]

  - id: d01_preschool
    kind: single
    section: variable
    core_key: sat_preschool
    audio_key: d01_preschool_v1
    text: >-
      Насколько вы удовлетворены качеством и доступностью дошкольного
      образования, детских садов в вашем населённом пункте?
    ask_if:
      core_key: kids_preschool
      codes: [1]
    next: d02_filter
    options: *satisfaction_never

  - id: d02_filter
    kind: single
    section: variable
    core_key: kids_school
    audio_key: d02_filter_v1
    text: "А дети или внуки школьного возраста у вас есть?"
    next: d02_school
    options:
      - code: 1
        label: "Есть"
        phrases: ["да", "есть", "учатся", "учится", "конечно"]
      - code: 2
        label: "Нет"
        phrases: ["нет", "нету", "не учатся", "таких нет"]

  - id: d02_school
    kind: single
    section: variable
    core_key: sat_school
    audio_key: d02_school_v1
    text: >-
      Насколько вы удовлетворены качеством и доступностью школьного образования?
    ask_if:
      core_key: kids_school
      codes: [1]
    next: d03_college
    options: *satisfaction_never

  - id: d03_college
    kind: single
    section: variable
    core_key: sat_college
    audio_key: d03_college_v1
    text: >-
      Насколько вы удовлетворены качеством и доступностью среднего
      профессионального образования — колледжей, техникумов?
    next: d04_university
    options: *satisfaction_never

  - id: d04_university
    kind: single
    section: variable
    core_key: sat_university
    audio_key: d04_university_v1
    text: >-
      Насколько вы удовлетворены качеством и доступностью высшего образования?
    next: d05_filter
    options: *satisfaction_never

  # ----------------------------------------------------------- медицина (Д5)
  - id: d05_filter
    kind: single
    section: variable
    core_key: med_experience
    audio_key: d05_filter_v1
    # Вопрос-предпосылка из анкеты Заказчика. Сам Д5 задаётся всем, но
    # в анализе оценку по личному опыту нужно отделить от оценки по слухам:
    # это два разных показателя, и смешивать их нельзя.
    text: >-
      Вы или члены вашей семьи обращались за медицинской помощью
      за последние двенадцать месяцев?
    next: d05_medicine
    options:
      - code: 1
        label: "Обращались"
        phrases: ["да", "обращались", "обращался", "обращалась", "приходилось"]
      - code: 2
        label: "Не обращались"
        phrases: ["нет", "не обращались", "не обращался", "не приходилось",
                  "не болели"]

  - id: d05_medicine
    kind: single
    section: variable
    core_key: sat_medicine
    audio_key: d05_medicine_v1
    text: >-
      Насколько вы удовлетворены качеством и доступностью медицинской помощи?
    next: d06_youth_region
    options: *satisfaction

  # ------------------------------------------------- молодёжь (Д6-Д7)
  - id: d06_youth_region
    kind: single
    section: variable
    core_key: youth_region
    audio_key: d06_youth_region_v1
    text: >-
      Как вы оцениваете возможности для самореализации молодых людей в вашем
      регионе — учиться, работать, строить карьеру, реализовать свои идеи:
      скорее хорошие или скорее плохие?
    next: d07_youth_russia
    options:
      - code: 1
        label: "Скорее хорошие"
        phrases: ["хорошие", "скорее хорошие", "хорошо", "неплохие", "первое"]
      - code: 2
        label: "Скорее плохие"
        phrases: ["плохие", "скорее плохие", "плохо", "никакие", "второе"]

  - id: d07_youth_russia
    kind: single
    section: variable
    core_key: youth_russia
    audio_key: d07_youth_russia_v1
    # Сводный индекс по Д6 и Д7 считается на этапе анализа: разрыв между
    # оценкой своего региона и страны в целом — самостоятельный показатель.
    text: >-
      А в России в целом возможности для самореализации молодых людей
      вы оцениваете как скорее хорошие или скорее плохие?
    next: d08_culture
    options:
      - code: 1
        label: "Скорее хорошие"
        phrases: ["хорошие", "скорее хорошие", "хорошо", "неплохие", "первое"]
      - code: 2
        label: "Скорее плохие"
        phrases: ["плохие", "скорее плохие", "плохо", "никакие", "второе"]

  # ------------------------------------------------------------ культура (Д8)
  - id: d08_culture
    kind: single
    section: variable
    core_key: sat_culture
    audio_key: d08_culture_v1
    text: >-
      Насколько вы удовлетворены работой учреждений культуры — домов культуры,
      библиотек, театров, музеев, кинотеатров?
    next: d09_childbirth
    options: *satisfaction_unused

  # --------------------------------------------------------- демография (Д9-Д10)
  - id: d09_childbirth
    kind: single
    section: variable
    core_key: childbirth_plans
    audio_key: d09_childbirth_v1
    # Фильтр по возрасту 18-45. Верхняя граница для мужчин может быть поднята
    # до 50 решением Заказчика — тогда правится только эта строка.
    text: >-
      Планируете ли вы в ближайшие три года завести ребёнка
      или ещё одного ребёнка?
    ask_if:
      core_key: age
      between: [18, 45]
    next: d10_children_conditions
    sensitive: true
    required: false
    options:
      - code: 1
        label: "Да, планирую"
        phrases: ["да", "планирую", "планируем", "думаем", "хотим", "собираемся"]
      - code: 2
        label: "Нет, не планирую"
        phrases: ["нет", "не планирую", "не планируем", "не собираюсь", "хватит"]

  - id: d10_children_conditions
    kind: single
    section: variable
    core_key: sat_children_conditions
    audio_key: d10_children_conditions_v1
    # Задаётся всем: для ряда динамики нужна вся выборка. Отдельный показатель
    # по мужчинам и женщинам 18-50 лет выделяется в анализе — данных для этого
    # достаточно, пол и возраст уже собраны.
    text: >-
      Насколько вы удовлетворены условиями, которые созданы для рождения
      и воспитания детей в вашем регионе — выплатами, льготами, детскими
      садами, медициной?
    next: "@next"
    options: *satisfaction
