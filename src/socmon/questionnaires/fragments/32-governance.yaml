# Дополнительный модуль «Госуправление и экономика»: Д19-Д24, Д26.
# Госслужащие, госуслуги, связь, туризм, малый бизнес, переобучение,
# волонтёрство. Хронометраж ~1:10.

_scales:
  satisfaction_never: &satisfaction_never
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена", "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да", "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена", "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет", "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не сталкивался с этим"
      phrases: ["не сталкивался", "не сталкивалась", "не приходилось", "меня не касается"]
  satisfaction_unused: &satisfaction_unused
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена", "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да", "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена", "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет", "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не пользуюсь"
      phrases: ["не пользуюсь", "не хожу", "не езжу", "не бываю"]
  satisfaction_novisit: &satisfaction_novisit
    - code: 1
      label: "Полностью удовлетворён"
      phrases: ["полностью удовлетворен", "полностью удовлетворена", "полностью", "полностью доволен", "первое"]
    - code: 2
      label: "Скорее удовлетворён"
      phrases: ["скорее удовлетворен", "скорее удовлетворена", "скорее да", "в целом да", "второе"]
    - code: 3
      label: "Скорее не удовлетворён"
      phrases: ["скорее не удовлетворен", "скорее не удовлетворена", "скорее нет", "не очень", "третье"]
    - code: 4
      label: "Совсем не удовлетворён"
      phrases: ["совсем не удовлетворен", "совсем не удовлетворена", "совсем нет", "совершенно не удовлетворен", "абсолютно нет", "четвертое"]
    - code: 5
      label: "Не обращался"
      phrases: ["не обращался", "не обращалась", "не приходилось обращаться"]

nodes:
  - id: mod_gov_intro
    kind: info
    section: variable
    audio_key: mod_gov_intro_v1
    text: >-
      И последний короткий блок — о государственных услугах и условиях
      для работы. На каждый вопрос отвечайте одним из четырёх вариантов:
      полностью удовлетворён, скорее удовлетворён, скорее не удовлетворён
      или совсем не удовлетворён.
    next: d19_officials

  - id: d19_officials
    kind: single
    section: variable
    core_key: sat_officials
    audio_key: d19_officials_v1
    text: >-
      Насколько вы удовлетворены качеством работы государственных
      и муниципальных служащих — их вежливостью, компетентностью,
      готовностью помочь?
    next: d20_egov
    options: *satisfaction_novisit

  - id: d20_egov
    kind: single
    section: variable
    core_key: sat_egov
    audio_key: d20_egov_v1
    text: >-
      Насколько вы удовлетворены возможностью получать государственные
      услуги через интернет?
    next: d21_communications
    options: *satisfaction_unused

  - id: d21_communications
    kind: single
    section: variable
    core_key: sat_communications
    audio_key: d21_communications_v1
    text: >-
      Насколько вы удовлетворены качеством связи и интернета в вашем
      населённом пункте?
    next: d22_tourism
    options: *satisfaction_unused

  - id: d22_tourism
    kind: single
    section: variable
    core_key: tourism_conditions
    audio_key: d22_tourism_v1
    text: >-
      Как вы оцениваете условия для отдыха и путешествий по России —
      доступность, цены, качество сервиса: скорее хорошие или скорее плохие?
    next: d23_business
    options:
      - code: 1
        label: "Скорее хорошие"
        phrases: ["хорошие", "скорее хорошие", "нормальные", "неплохие", "первое"]
      - code: 2
        label: "Скорее плохие"
        phrases: ["плохие", "скорее плохие", "плохо", "дорого", "второе"]
      - code: 3
        label: "Не путешествую по России"
        phrases: ["не путешествую", "не езжу", "никуда не езжу", "не отдыхаю"]

  - id: d23_business
    kind: single
    section: variable
    core_key: business_conditions
    audio_key: d23_business_v1
    text: >-
      Как вы оцениваете условия для открытия и ведения своего дела, малого
      и среднего бизнеса в вашем регионе: скорее хорошие или скорее плохие?
    next: d24_retraining
    options:
      - code: 1
        label: "Скорее хорошие"
        phrases: ["хорошие", "скорее хорошие", "нормальные", "неплохие", "первое"]
      - code: 2
        label: "Скорее плохие"
        phrases: ["плохие", "скорее плохие", "плохо", "невозможно", "второе"]

  - id: d24_retraining
    kind: single
    section: variable
    core_key: sat_retraining
    audio_key: d24_retraining_v1
    text: >-
      Насколько вы удовлетворены возможностями пройти переобучение, повысить
      квалификацию, получить новую профессию в вашем регионе?
    next: d26_volunteering
    options: *satisfaction_never

  - id: d26_volunteering
    kind: single
    section: variable
    core_key: volunteering
    audio_key: d26_volunteering_v1
    text: >-
      Готовы ли вы лично участвовать в волонтёрской, добровольческой
      деятельности — помогать людям, участвовать в общественных акциях
      безвозмездно: уже участвуете, готовы участвовать или скорее не готовы?
    next: "@next"
    options:
      - code: 1
        label: "Уже участвую"
        phrases: ["уже участвую", "участвую", "занимаюсь", "волонтер", "первое"]
      - code: 2
        label: "Готов участвовать"
        phrases: ["готов", "готова", "готов участвовать", "можно", "да", "второе"]
      - code: 3
        label: "Скорее не готов"
        phrases: ["не готов", "не готова", "скорее не готов", "нет", "некогда",
                  "нет времени", "третье"]
