{% extends "base.html" %}
{% block title %}Не получилось{% endblock %}
{% block body %}
<div style="max-width:460px;margin:70px auto;text-align:center">
  <div style="font-size:44px;color:var(--muted)">{{ code }}</div>
  <h1 style="margin-top:8px">
    {% if code == 403 %}Недостаточно прав
    {% elif code == 404 %}Страница не найдена
    {% else %}Не получилось{% endif %}
  </h1>
  <p class="sub">{{ detail }}</p>
  <a href="/"><button class="link">На главную</button></a>
</div>
{% endblock %}
