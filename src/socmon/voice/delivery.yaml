# Служебные реплики подачи: отклики, префиксы переспроса, оклик при тишине.
#
# Это не вопросы анкеты, а то, что живой интервьюер говорит между ними:
# «угу», «понятно», «простите, повторю». Без них робот выдаёт себя не голосом,
# а поведением — вопрос вылетает в ту же миллисекунду, как распознан ответ,
# и всегда одинаково.
#
# Формулировки подлежат утверждению Заказчиком наравне с анкетой (ТЗ §8.1):
# робот произносит только то, что здесь записано. Правка любого слова меняет
# version_id каталога, и старые записи к новому тексту не подходят.
#
# Формы с родом заданы парой: женский голос говорит «расслышала», мужской —
# «расслышал». Ключ реплики не зависит от рода — библиотека каждого голоса
# содержит свой вариант под тем же ключом.

name: "Служебные реплики подачи"

pools:
  # После закрытого ответа. Не после каждого — живой человек тоже
  # откликается не всегда — и никогда дважды подряд одним словом.
  ack_closed:
    - key: ack_ugu
      text: "Угу."
    - key: ack_aga
      text: "Ага."
    - key: ack_ponyatno
      text: "Понятно."
    - key: ack_yasno
      text: "Ясно."
    - key: ack_horosho
      text: "Хорошо."
    - key: ack_tak
      text: "Так."
    - key: ack_spasibo
      text: "Спасибо."
    - key: ack_ponyal
      text:
        f: "Поняла."
        m: "Понял."

  # После развёрнутого ответа на открытый вопрос — всегда: человек только что
  # рассказывал, и молчание в ответ читается как «вас не слушали».
  ack_open:
    - key: ack_open_spasibo
      text: "Спасибо, понятно."
    - key: ack_open_ponyatno
      text: "Понятно, спасибо."
    - key: ack_open_horosho
      text: "Хорошо, спасибо."
    - key: ack_open_zapisala
      text:
        f: "Спасибо, записала."
        m: "Спасибо, записал."

  # После отказа отвечать или «затрудняюсь». Мягче обычного отклика:
  # право не отвечать — законное, и давить на человека нельзя (ТЗ §7.6).
  ack_soft:
    - key: ack_soft_horosho
      text: "Хорошо."
    - key: ack_soft_ponimayu
      text: "Понимаю."
    - key: ack_soft_nichego
      text: "Ничего страшного."
    - key: ack_soft_dalshe
      text: "Хорошо, идём дальше."

  # Респондент попросил повторить.
  repeat_asked:
    - key: rep_konechno
      text: "Конечно."
    - key: rep_da_konechno
      text: "Да, конечно."
    - key: rep_povtoryu
      text: "Повторю."

  # Ответ не разобран. Сам вопрос повторяется дословно (ТЗ §8.1);
  # префикс лишь объясняет, почему его задают снова.
  repeat_unheard:
    - key: rep_ne_rasslyshal
      text:
        f: "Простите, я не расслышала. Повторю вопрос."
        m: "Простите, я не расслышал. Повторю вопрос."
    - key: rep_ne_razobral
      text:
        f: "Извините, не разобрала. Ещё раз."
        m: "Извините, не разобрал. Ещё раз."

  # Уклончивый ответ: «средне», «не очень», «и да и нет». Живой интервьюер
  # уточняет один раз, прежде чем записать «затрудняюсь». Вопрос после
  # уточнения повторяется дословно.
  probe:
    - key: probe_vse_zhe
      text: "И всё же, если выбирать из названных вариантов."
    - key: probe_blizhe
      text: "Понимаю. А если всё-таки выбрать один вариант, ближе к чему?"
    - key: probe_odin
      text: "Хорошо. Если выбрать что-то одно."

  # «А вы кто такие?» Человек вправе узнать, с кем говорит, прежде чем
  # отвечать. Объясняем и возвращаемся к вопросу — это не отказ.
  who:
    - key: who_opros
      text: >-
        Это анонимный социологический опрос жителей Республики, его проводит
        голосовой помощник. Ваш номер выбран случайным образом и хранится
        отдельно от ответов. Вернёмся к вопросу.
    - key: who_korotko
      text: >-
        Я голосовой помощник социологического опроса. Номер выбран случайно,
        ответы анонимны, участие добровольное. Повторю вопрос.

  # Тишина после вопроса. Оклик идёт раньше тайм-аута: живой интервьюер
  # не ждёт шесть секунд молча.
  nudge:
    - key: nudge_allo
      text: "Алло?"
    - key: nudge_slyshite
      text: "Вы меня слышите?"
    - key: nudge_zdes
      text: "Вы ещё здесь?"
