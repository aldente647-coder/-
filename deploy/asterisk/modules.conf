; Грузим только нужное. Каждый лишний модуль — лишняя поверхность атаки
; на машине, где лежат записи разговоров и телефонные номера.

[modules]
autoload = yes

; Каналы и протоколы, которые нам не нужны.
noload = chan_sip.so
noload = chan_skinny.so
noload = chan_mgcp.so
noload = chan_unistim.so
noload = chan_iax2.so

; AMI не используем — всё управление идёт через ARI, — но выгрузить его
; нельзя: начиная с Asterisk 22 manager.so встроенный, и `noload` для него
; валит запуск с «is a built-in module». Отключается он в manager.conf.

; Голосовая почта, конференции, очереди — не наш сценарий.
noload = app_voicemail.so
noload = app_meetme.so
noload = app_queue.so
