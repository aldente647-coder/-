; Транк до оператора связи и точка подключения оператора-человека.
;
; ВАЖНО, и это не техническая деталь. Договор с оператором связи, возможно,
; должен быть оформлен на Заказчика, а не на Исполнителя: ст. 44.1-1 ФЗ-126
; разрешает массовые вызовы без согласия абонента только по инициативе
; госорганов и подведомственных им организаций (RESEARCH.md §4). От того,
; чьи здесь реквизиты, зависит, кому прилетит штраф до 1 млн рублей.
;
; Секретов в этом файле нет: пароли подставляются при развёртывании
; из переменных окружения.

[global]
type = global
user_agent = socmon
; Не раскрываем версию Asterisk наружу.
endpoint_identifier_order = ip,username,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Внешние адреса для NAT. На стенде без NAT строки ниже убрать.
external_media_address = ${SOCMON_EXTERNAL_IP}
external_signaling_address = ${SOCMON_EXTERNAL_IP}
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16

; --------------------------------------------------------------------------
; Транк оператора связи
; --------------------------------------------------------------------------

[trunk]
type = endpoint
context = socmon-inbound
transport = transport-udp
outbound_auth = trunk-auth
aors = trunk-aor
from_user = ${SOCMON_TRUNK_USER}
from_domain = ${SOCMON_TRUNK_HOST}

; Только G.711 и никакого транскодинга.
;
; Телефонный канал всё равно 8 кГц — ровно то, подо что озвучена анкета
; (voice/synth.py). Разрешить широкополосные кодеки значит заставить
; Asterisk перекодировать на каждом канале и сжечь процессор на сотне линий,
; не выиграв ни в качестве распознавания, ни в разборчивости.
disallow = all
allow = alaw
allow = ulaw

; Медиа обязано идти через нас.
;
; При direct_media=yes голос пошёл бы напрямую между абонентом и оператором,
; и записывать стало бы нечего. А запись разговора — требование ТЗ §10.2
; и основание для всей последующей аналитики.
direct_media = no

; Определитель автоответчика и запись требуют, чтобы канал был «живым».
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
send_rpid = yes

[trunk-auth]
type = auth
auth_type = userpass
username = ${SOCMON_TRUNK_USER}
password = ${SOCMON_TRUNK_PASSWORD}

[trunk-aor]
type = aor
contact = sip:${SOCMON_TRUNK_HOST}
qualify_frequency = 60

[trunk-registration]
type = registration
transport = transport-udp
outbound_auth = trunk-auth
server_uri = sip:${SOCMON_TRUNK_HOST}
client_uri = sip:${SOCMON_TRUNK_USER}@${SOCMON_TRUNK_HOST}
retry_interval = 60
forbidden_retry_interval = 600
expiration = 3600

[trunk-identify]
type = identify
endpoint = trunk
match = ${SOCMON_TRUNK_HOST}

; --------------------------------------------------------------------------
; Дежурный оператор (ТЗ §9.2)
; --------------------------------------------------------------------------

[operator1]
type = endpoint
context = socmon-operator
transport = transport-udp
auth = operator1-auth
aors = operator1-aor
disallow = all
allow = alaw
allow = ulaw
direct_media = no

[operator1-auth]
type = auth
auth_type = userpass
username = operator1
password = ${SOCMON_OPERATOR1_PASSWORD}

[operator1-aor]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
