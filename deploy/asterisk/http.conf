; HTTP-сервер Asterisk. Нужен только под ARI — иначе управлять звонками
; снаружи нечем.
;
; Слушает петлю: наружу ARI не выставляется никогда. Управляющий процесс
; живёт на той же машине либо ходит через SSH-туннель. ARI даёт полный
; контроль над АТС, включая прослушивание каналов, и открытый порт — это
; сразу и утечка персональных данных, и чужие звонки за ваш счёт.

[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
prefix =
enablestatic = no

; TLS не нужен на петле и добавляет возню с сертификатами.
; Если ARI выносится на отдельную машину — включать обязательно.
tlsenable = no
