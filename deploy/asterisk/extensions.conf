; Дилплан.
;
; Логики анкеты здесь нет и быть не может: граф вопросов версионируется вместе
; с анкетой и меняется каждую волну (ТЗ §7.3). Дилплан делает ровно две вещи —
; прогоняет детектор автоответчика и передаёт канал управляющему процессу.

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
STASIS_APP = socmon
OPERATOR = PJSIP/operator1

; --------------------------------------------------------------------------
; Исходящий обзвон
; --------------------------------------------------------------------------
;
; Сюда попадает канал, когда абонент снял трубку. Порядок шагов принципиален:
; AMD обязан отработать ДО Stasis. Если заводить звонок сразу в Stasis
; (POST /channels с параметром app), дилплан не выполняется вовсе, детектор
; не запускается, и робот начинает зачитывать анкету голосовой почте.

[socmon-outbound]
exten => s,1,NoOp(Попытка ${SOCMON_ATTEMPT})
    same => n,Answer()

    ; Первая линия защиты от автоответчиков (ТЗ §6.3).
    ; Результат ложится в AMDSTATUS: HUMAN, MACHINE или NOTSURE.
    same => n,AMD()
    same => n,NoOp(AMD: ${AMDSTATUS} / ${AMDCAUSE})

    ; NOTSURE трактуется как человек: цена ошибки несимметрична, см. amd.conf.
    same => n,ExecIf($["${AMDSTATUS}" = "NOTSURE"]?Set(AMDSTATUS=HUMAN))

    ; Идентификатор попытки уходит аргументом приложения, дублируя переменную
    ; канала. Переменная переживает перезапуск управляющего процесса,
    ; аргумент приходит в первом же событии.
    same => n,Stasis(${STASIS_APP},${SOCMON_ATTEMPT},${AMDSTATUS})

    ; Сюда канал возвращается, если управляющий процесс отпустил его
    ; или недоступен. Оставлять абонента в тишине нельзя.
    same => n,Hangup()

; Аварийная ветка: Stasis-приложение не запущено. Молчать в трубку хуже,
; чем честно попрощаться.
exten => failed,1,NoOp(Управляющий процесс недоступен)
    same => n,Playback(socmon/technical-issue)
    same => n,Hangup()

; --------------------------------------------------------------------------
; Единый номер для обратного звонка (ТЗ §9.1)
; --------------------------------------------------------------------------
;
; С этого номера идёт обзвон, и на него же абонент может перезвонить.
; Требования §9.1: работоспособность номера, голосовое информирование,
; сообщение о цели исследования и контактах, возможность оставить обращение,
; передача значимых обращений Заказчику, журнал обратных звонков.
;
; Журнал ведёт управляющий процесс — поэтому канал уходит в Stasis, а не
; обрабатывается дилпланом целиком.

[socmon-inbound]
exten => _X.,1,NoOp(Обратный звонок с ${CALLERID(num)})
    same => n,Answer()
    same => n,Wait(1)

    ; Информирование: кто звонил, зачем, и что делать дальше.
    same => n,Playback(socmon/callback-info)

    ; Дальше решает управляющий процесс: соединить с дежурным оператором,
    ; принять обращение или внести номер в стоп-лист по просьбе абонента.
    same => n,Stasis(${STASIS_APP},inbound,${CALLERID(num)})
    same => n,Hangup()

; --------------------------------------------------------------------------
; Дежурный оператор (ТЗ §9.2)
; --------------------------------------------------------------------------
;
; Перевод строится мостом, а не переадресацией: при переадресации канал
; уходит из-под контроля, а вместе с ним запись, события и возможность
; закрыть зависший звонок. Мост поднимает управляющий процесс через ARI,
; этот контекст нужен для входящей ноги оператора.

[socmon-operator]
exten => s,1,NoOp(Оператор подключается к попытке ${SOCMON_ATTEMPT})
    same => n,Answer()
    same => n,Stasis(${STASIS_APP},${SOCMON_ATTEMPT},operator)
    same => n,Hangup()

; --------------------------------------------------------------------------
; Контрольный звонок
; --------------------------------------------------------------------------
;
; Искусственный звонок, проходящий весь путь как настоящий: проверить цепочку
; перед волной и после обновления. Помечается тестовым и не попадает
; ни в статистику, ни в аналитический массив — тестовое интервью в валидном
; массиве нарушает ТЗ §5.3.

[socmon-selftest]
exten => s,1,NoOp(Контрольный звонок)
    same => n,Answer()
    same => n,Set(SOCMON_TEST=1)
    same => n,AMD()
    same => n,Stasis(${STASIS_APP},${SOCMON_ATTEMPT},${AMDSTATUS})
    same => n,Hangup()
