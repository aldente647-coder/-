; ARI — управляющий интерфейс. Через него рантайм набирает номера, играет
; реплики, пишет разговор и переводит на оператора.

[general]
enabled = yes
pretty = no

; Переменные канала, которые Asterisk кладёт в каждое событие.
;
; Без этого списка события приходят «голыми», и связать их с попыткой дозвона
; можно только по реестру каналов в памяти управляющего процесса. Реестр
; не переживает перезапуск — а звонки в этот момент идут.
;
; SOCMON_ATTEMPT   — наш идентификатор попытки (см. telephony/asterisk.py)
; AMDSTATUS/AMDCAUSE — вердикт детектора автоответчика
channelvars = SOCMON_ATTEMPT,AMDSTATUS,AMDCAUSE

[socmon]
type = user
read_only = no
; Пароль не здесь. Он в переменной окружения SOCMON_ARI_PASSWORD, а сюда
; подставляется при развёртывании: конфиги лежат в репозитории, секреты — нет.
password = ${SOCMON_ARI_PASSWORD}
password_format = plain
