; Детектор автоответчика — первая линия защиты (ТЗ §6.3).
;
; Вторая линия, разбор полного транскрипта задним числом, работает в ночном
; пайплайне. Одной линии заведомо мало: голосовой ассистент оператора связи
; отвечает «Алло» как человек, а «абоненту сейчас неудобно говорить» звучит
; уже после того, как AMD вынес вердикт.
;
; Пороги подобраны консервативно: цена ошибки несимметрична. Принять человека
; за автоответчик — потерянное интервью и раздражённый абонент. Принять
; автоответчик за человека — минута связи и одна испорченная запись.
; Поэтому при сомнении AMD отдаёт NOTSURE, и мы говорим.

[general]
; Сколько всего слушаем, прежде чем сдаться.
total_analysis_time = 4000

; «Алло» живого человека короткое. Длинная первая реплика — почти всегда
; приветствие автоответчика.
initial_silence = 2500
greeting = 1500

; Паузы внутри речи.
after_greeting_silence = 800
silence_threshold = 256
min_word_length = 100
between_words_silence = 50
maximum_number_of_words = 3

; Если уверенности нет — считаем, что говорит человек.
maximum_word_length = 5000
